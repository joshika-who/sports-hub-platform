version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sportshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportshub
      POSTGRES_PASSWORD: sportshub_pass
      POSTGRES_DB: sportshub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportshub -d sportshub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportshub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional local LLM service (uncomment to run Ollama inside Docker instead of host)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: sportshub-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  # ollamadata:

